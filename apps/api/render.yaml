services:
  - type: web
    name: bayanserve-api
    env: node
    region: singapore
    plan: free
    buildCommand: cd ../.. && npm install && npm run build --workspace=api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_LGU_NAME
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_LGU_MUNICIPALITY
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_LGU_PROVINCE
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_LGU_PRIMARY_COLOR
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_LGU_PHONE
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_LGU_EMAIL
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_LGU_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_LGU_LOGO_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
